[package]
name = "tokio-test-app"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { path = ".repro/tokio/tokio", features = ["full", "test-util", "schedule-latency"] }
dial9 = { path = ".repro/dial9/dial9" }
dial9-tokio-telemetry = { path = ".repro/dial9/dial9-tokio-telemetry", features = ["analysis"] }
dial9-core = { path = ".repro/dial9/dial9-core" }
dial9-trace-format = { path = ".repro/dial9/dial9-trace-format", features = ["serde", "serde-deserialize"] }

[dev-dependencies]
serde_json = "1"

[patch.crates-io]
tokio = { path = ".repro/tokio/tokio" }
